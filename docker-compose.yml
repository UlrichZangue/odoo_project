services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5
  odoo:
    image: odoo:16.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ODOO_DATABASE: ${POSTGRES_DB:-odoo}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?Set ODOO_ADMIN_PASSWORD in .env}
    command:
      - /bin/bash
      - -c
      - |
        printf '%s\n' \
          '[options]' \
          "admin_passwd = $${ODOO_ADMIN_PASSWORD}" \
          "db_host = $${HOST}" \
          "db_port = $${PORT}" \
          "db_user = $${USER}" \
          "db_password = $${PASSWORD}" \
          "db_name = $${ODOO_DATABASE}" \
          'addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons' \
          > /tmp/odoo-runtime.conf
        exec odoo --config=/tmp/odoo-runtime.conf --init=client_support_intervention
    volumes:
      - odoo_data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8069/web/health', timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
volumes:
  postgres_data:
  odoo_data:
